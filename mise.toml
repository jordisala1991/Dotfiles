# Deploys the dotfiles into $HOME with `mise dot apply` (run by install.sh).
# Each group is a package directory whose contents mirror their path under $HOME.

[settings]
dotfiles.root = "."

# symlink-each (the default) links files, never whole directories,
# so ~/.ssh and ~/.claude stay real directories outside the repo.
[dotfile_groups.zsh]
root = "zsh"

[dotfile_groups.git]
root = "git"

[dotfile_groups.vim]
root = "vim"

[dotfile_groups.ssh]
root = "ssh"

[dotfile_groups.mise]
root = "mise"

[dotfile_groups.claude]
root = "claude"
exclude = ["settings.shared.json"]

[dotfiles]
"~/.ssh" = { permissions = "0700" }
# Claude Code and Orca rewrite settings.json, so own only the keys in settings.shared.json
"~/.claude/settings.json/shared" = { source = "claude/settings.shared.json", merge = true }
